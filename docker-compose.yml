name: tickzap

services:
  api:
    build:
      context: apps/api
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api:/apps/api
    depends_on:
      - database
      - redis

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/apps/web
    depends_on:
      - api

  database:
    image: postgres:18
    environment:
      POSTGRES_USER: 'user'
      POSTGRES_PASSWORD: 'secret'
      POSTGRES_DB: 'tickzap'
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - "5432:5432"

  redis:
    image: redis:8

volumes:
  db_data:
  minio_data:

networks:
  default:
    name: tickzap_network
    driver: bridge
