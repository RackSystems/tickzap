name: API

on:
  push:
    branches:
      - main
    paths: &paths
      - 'apps/api/**'
      - '.github/workflows/api.yml'
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build API image
        id: build
        run: docker build --target ci --tag tickzap-api-ci apps/api

      - name: Run lint
        run: docker run --rm tickzap-api-ci bun run lint

      - name: Check formatting
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: docker run --rm tickzap-api-ci bun run format:check
